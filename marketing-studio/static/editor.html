<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Studio</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--panel2:#1d242d;--line:#2b3440;--text:#e6edf3;--mute:#8b98a7;--acc:#ff7a1a;--acc2:#ffb066;--ok:#3fb950;--bad:#f85149}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0;color:var(--acc)}
main{display:grid;grid-template-columns:270px minmax(320px,1fr) 340px;gap:10px;padding:10px;height:calc(100vh - 49px)}
@media(max-width:1000px){main{grid-template-columns:1fr;height:auto}}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.card h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
button,select,input,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
button{cursor:pointer}button:hover{border-color:var(--acc2)}
button.pri{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
button.sm{padding:1px 6px;font-size:12px}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
input[type=color]{padding:0;width:34px;height:26px}
input[type=range]{padding:0;accent-color:var(--acc)}
textarea{width:100%;resize:vertical}
.row{display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:center;margin:4px 0}
.row label{color:var(--mute);font-size:12px}
.row>div{display:flex;gap:6px;align-items:center;min-width:0}
.row input:not([type=color]):not([type=checkbox]):not([type=range]),.row select{width:100%;min-width:0}
.row input[type=range]{flex:1;min-width:0}
.item{display:flex;align-items:center;gap:4px;padding:5px 6px;border:1px solid transparent;border-radius:6px;cursor:pointer}
.item:hover{background:var(--panel2)}.item.sel{border-color:var(--acc);background:var(--panel2)}
.item span.n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mute{color:var(--mute)}
#stage{background:#000;border-radius:8px;display:flex;align-items:center;justify-content:center;height:min(58vh,560px);flex:none;position:relative;overflow:hidden}
#stage img{max-width:100%;max-height:100%;object-fit:contain;display:block}
#err{color:var(--bad);position:absolute;left:8px;right:8px;bottom:8px;background:#000c;padding:6px;border-radius:6px;display:none}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);width:0}
.chk{display:flex;gap:6px;align-items:center;padding:2px 0}.chk small{color:var(--mute)}
.out{padding:6px;border:1px solid var(--line);border-radius:6px;margin-top:6px}
.out video,.out img{max-width:100%;max-height:220px;display:block;margin:6px 0}
a{color:var(--acc2)}
.thumb{width:28px;height:28px;object-fit:cover;border-radius:4px;background:#000}
.tabs{display:flex;gap:4px;margin-bottom:8px}.tabs button.on{background:var(--acc);color:#111;border-color:var(--acc)}
.warn{background:#3a2a10;border:1px solid #6b4a14;color:#ffd58a;padding:6px 8px;border-radius:6px;margin-bottom:8px;display:none}
</style>
</head>
<body>
<header>
  <h1>Marketing Studio · Advanced editor</h1><a href="/" style="color:var(--acc2)">← Simple mode</a>
  <select id="tplSel" title="Start from a template"><option value="">Templates…</option></select>
  <select id="projSel" title="Open a saved project (projects/ folder)"><option value="">Open project…</option></select>
  <button id="saveBtn" class="pri">Save project</button>
  <button id="dlBtn">Download JSON</button>
  <button id="jsonBtn">Edit JSON</button>
  <span class="mute" id="status"></span>
</header>

<main>
  <!-- LEFT: project + scenes + assets -->
  <div class="col">
    <div class="warn" id="ffwarn">ffmpeg not found: images export fine, but video needs ffmpeg (see README).</div>
    <div class="card"><h2>Project</h2><div id="projForm"></div></div>
    <div class="card"><h2>Scenes <button class="sm" id="addScene">+ Add</button></h2><div id="sceneList"></div></div>
    <div class="card"><h2>Assets <label class="sm" style="cursor:pointer"><input type="file" id="upl" multiple hidden accept="image/*,audio/*">+ Upload</label></h2>
      <div id="assetList" class="mute">Logos, photos, music. Stored in assets/ on your machine.</div></div>
  </div>

  <!-- CENTER: preview + export -->
  <div class="col">
    <div id="stage"><img id="prev" alt="preview"><div id="err"></div></div>
    <div class="card" style="display:flex;gap:8px;align-items:center">
      <button id="play">▶</button>
      <input type="range" id="scrub" min="0" max="1000" value="0" style="flex:1">
      <span id="tlabel" class="mute" style="min-width:90px;text-align:right">0.0 / 0.0s</span>
    </div>
    <div class="card"><h2>Export</h2>
      <div class="row"><label>Format</label><div><select id="fmt"><option value="mp4">MP4 video</option><option value="gif">GIF (≤640px)</option><option value="png">PNG image</option><option value="jpg">JPG image</option></select></div></div>
      <div class="row" id="sceneRow"><label>Scene (images)</label><div><select id="expScene"></select></div></div>
      <div id="sizes"></div>
      <div class="row"><label>Custom size</label><div><input id="cw" type="number" placeholder="W" min="64" max="4096"><input id="ch" type="number" placeholder="H" min="64" max="4096"></div></div>
      <button class="pri" id="renderBtn" style="width:100%;margin-top:6px">Render</button>
      <div id="jobs"></div>
    </div>
  </div>

  <!-- RIGHT: scene + layer editing -->
  <div class="col">
    <div class="card" id="jsonCard" style="display:none"><h2>Project JSON</h2>
      <textarea id="jsonBox" rows="22" spellcheck="false"></textarea>
      <button class="pri" id="jsonApply" style="margin-top:6px">Apply</button> <span id="jsonErr" style="color:var(--bad)"></span></div>
    <div class="card"><h2>Scene</h2><div id="sceneForm"></div></div>
    <div class="card"><h2>Layers
      <span><button class="sm" data-add="text">+ Text</button> <button class="sm" data-add="image">+ Image</button> <button class="sm" data-add="shape">+ Shape</button></span></h2>
      <div id="layerList"></div></div>
    <div class="card" id="layerCard" style="display:none"><h2>Layer settings</h2><div id="layerForm"></div></div>
  </div>
</main>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const info = { presets: [], fonts: [], anims_in: [], anims_out: [], transitions: [], env: {} };
let spec = null, selScene = 0, selLayer = null, T = 0, total = 1, assets = [], playing = null;

// ------------------------------------------------------------------ api
async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const ct = r.headers.get('content-type') || '';
  const data = ct.includes('json') ? await r.json() : r;
  if (!r.ok) throw new Error((data && data.error) || r.statusText);
  return data;
}
const post = (p, b) => api(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
const say = (m, bad) => { const s = $('#status'); s.textContent = m; s.style.color = bad ? 'var(--bad)' : 'var(--mute)'; clearTimeout(say.t); say.t = setTimeout(() => s.textContent = '', 4000); };

// ------------------------------------------------------------------ preview
let pvBusy = false, pvAgain = false, lastUrl = null;
function preview() { pvAgain = true; if (!pvBusy) pvLoop(); }
async function pvLoop() {
  pvBusy = true;
  while (pvAgain) {
    pvAgain = false;
    try {
      const r = await fetch('/api/preview', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ spec, t: T, max_edge: 720 }) });
      if (!r.ok) throw new Error((await r.json()).error);
      total = parseFloat(r.headers.get('X-Total-Duration')) || total;
      const url = URL.createObjectURL(await r.blob());
      $('#prev').src = url; if (lastUrl) URL.revokeObjectURL(lastUrl); lastUrl = url;
      $('#err').style.display = 'none';
      T = Math.min(T, total); updateTime();
    } catch (e) { const el = $('#err'); el.textContent = e.message; el.style.display = 'block'; }
  }
  pvBusy = false;
}
function updateTime() { $('#tlabel').textContent = `${T.toFixed(1)} / ${total.toFixed(1)}s`; $('#scrub').value = total ? T / total * 1000 : 0; }
$('#scrub').oninput = e => { T = e.target.value / 1000 * total; updateTime(); preview(); };
$('#play').onclick = () => {
  if (playing) { clearInterval(playing); playing = null; $('#play').textContent = '▶'; return; }
  $('#play').textContent = '⏸'; if (T >= total - 0.05) T = 0;
  let last = performance.now();
  playing = setInterval(() => {
    const n = performance.now(); T += (n - last) / 1000; last = n;
    if (T >= total) { T = 0; }
    updateTime(); if (!pvBusy) preview();
  }, 80);
};

// ------------------------------------------------------------------ state changes
let saveTimer;
function changed(rebuild) {
  if (rebuild) renderAll();
  preview();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem('ms_spec', JSON.stringify(spec)); } catch (e) {} }, 400);
}
const scene = () => spec.scenes[selScene];
const layer = () => selLayer == null ? null : scene().layers[selLayer];

// ------------------------------------------------------------------ form helpers
function fld(label, obj, key, o = {}) {
  const type = o.type || 'text';
  const cur = obj[key] ?? o.def;
  let input;
  const set = v => { if (v === '' || v == null) delete obj[key]; else obj[key] = v; if (o.after) o.after(); changed(o.rebuild); };
  if (type === 'select') {
    input = h('select', { onchange: e => set(e.target.value) }, (o.options || []).map(x => { const [v, t] = Array.isArray(x) ? x : [x, x]; return h('option', { value: v, selected: String(v) === String(cur) }, t); }));
  } else if (type === 'checkbox') {
    input = h('input', { type: 'checkbox', checked: !!cur, onchange: e => { if (e.target.checked) obj[key] = true; else delete obj[key]; changed(o.rebuild); } });
  } else if (type === 'textarea') {
    input = h('textarea', { rows: 2, oninput: e => set(e.target.value) }); input.value = cur ?? '';
  } else if (type === 'range') {
    const val = h('span', { class: 'mute', style: 'min-width:34px;text-align:right' }, String(cur ?? ''));
    input = h('input', { type: 'range', min: o.min, max: o.max, step: o.step, value: cur, oninput: e => { val.textContent = e.target.value; set(parseFloat(e.target.value)); } });
    return h('div', { class: 'row' }, h('label', {}, label), h('div', {}, input, val));
  } else if (type === 'number') {
    input = h('input', { type: 'number', min: o.min, max: o.max, step: o.step || 'any', value: cur ?? '', oninput: e => set(e.target.value === '' ? '' : parseFloat(e.target.value)) });
  } else if (type === 'color') {
    input = h('input', { type: 'color', value: /^#[0-9a-f]{6}$/i.test(cur) ? cur : '#ffffff', oninput: e => set(e.target.value) });
  } else {
    input = h('input', { type: 'text', value: cur ?? '', oninput: e => set(e.target.value) });
  }
  return h('div', { class: 'row' }, h('label', {}, label), h('div', {}, input));
}
const assetOpts = (kind) => [['', '— choose —']].concat(assets.filter(a => kind === 'audio' ? /\.(mp3|wav|m4a|aac|ogg)$/i.test(a) : /\.(png|jpe?g|webp|gif|bmp)$/i.test(a)));

// ------------------------------------------------------------------ renderers
function renderProject() {
  const f = $('#projForm'); f.replaceChildren();
  f.append(fld('Name', spec, 'name'));
  const presetSel = h('select', { onchange: e => { const p = info.presets.find(x => x.id === e.target.value); if (p) { spec.width = p.w; spec.height = p.h; changed(true); } } },
    h('option', { value: '' }, 'Canvas preset…'), info.presets.map(p => h('option', { value: p.id }, `${p.label} (${p.w}×${p.h})`)));
  f.append(h('div', { class: 'row' }, h('label', {}, 'Canvas'), h('div', {}, presetSel)));
  f.append(fld('Width', spec, 'width', { type: 'number', min: 64, max: 4096 }));
  f.append(fld('Height', spec, 'height', { type: 'number', min: 64, max: 4096 }));
  f.append(fld('FPS', spec, 'fps', { type: 'select', options: [24, 25, 30, 60], def: 30, after: () => { spec.fps = parseInt(spec.fps); } }));
  spec.transition = spec.transition || { type: 'fade', duration: 0.5 };
  f.append(fld('Transition', spec.transition, 'type', { type: 'select', options: info.transitions, def: 'fade' }));
  f.append(fld('Trans. secs', spec.transition, 'duration', { type: 'number', min: 0.1, max: 3, step: 0.1, def: 0.5 }));
  spec.audio = spec.audio || {};
  f.append(fld('Music', spec.audio, 'asset', { type: 'select', options: assetOpts('audio'), after: () => { if (!spec.audio.asset) spec.audio = {}; } }));
  if (spec.audio.asset) { f.append(fld('Volume', spec.audio, 'volume', { type: 'range', min: 0, max: 1.5, step: 0.05, def: 0.8 })); f.append(fld('Fade out', spec.audio, 'fade_out', { type: 'number', min: 0, max: 10, step: 0.5, def: 1 })); }
  if (!spec.audio.asset) delete spec.audio;
  f.append(h('div', { class: 'mute', style: 'margin-top:4px' }, 'Positions are % of canvas, so one design exports to every size.'));
}
function renderScenes() {
  const l = $('#sceneList'); l.replaceChildren();
  spec.scenes.forEach((sc, i) => {
    const mv = (d) => (e) => { e.stopPropagation(); const j = i + d; if (j < 0 || j >= spec.scenes.length) return; [spec.scenes[i], spec.scenes[j]] = [spec.scenes[j], spec.scenes[i]]; selScene = j; changed(true); };
    l.append(h('div', { class: 'item' + (i === selScene ? ' sel' : ''), onclick: () => { selScene = i; selLayer = null; changed(true); } },
      h('span', { class: 'n' }, `${i + 1}. `, (sc.layers.find(x => x.type === 'text') || {}).text || 'Scene', h('span', { class: 'mute' }, ` ${sc.duration}s`)),
      h('button', { class: 'sm', title: 'up', onclick: mv(-1) }, '↑'), h('button', { class: 'sm', title: 'down', onclick: mv(1) }, '↓'),
      h('button', { class: 'sm', title: 'duplicate', onclick: e => { e.stopPropagation(); spec.scenes.splice(i + 1, 0, JSON.parse(JSON.stringify(sc))); selScene = i + 1; changed(true); } }, '⧉'),
      h('button', { class: 'sm danger', title: 'remove', onclick: e => { e.stopPropagation(); if (spec.scenes.length < 2) return say('Need at least one scene', true); spec.scenes.splice(i, 1); selScene = Math.max(0, Math.min(selScene, spec.scenes.length - 1)); selLayer = null; changed(true); } }, '✕')));
  });
  const ex = $('#expScene'); ex.replaceChildren(h('option', { value: '' }, 'All scenes'), spec.scenes.map((_, i) => h('option', { value: i }, `Scene ${i + 1}` + (i === selScene ? ' (selected)' : ''))));
}
function renderSceneForm() {
  const f = $('#sceneForm'); f.replaceChildren(); const sc = scene();
  f.append(fld('Duration (s)', sc, 'duration', { type: 'number', min: 0.5, max: 120, step: 0.5, def: 3 }));
  const bg = sc.background = sc.background || { type: 'color', color: '#111111' };
  f.append(fld('Background', bg, 'type', { type: 'select', options: ['color', 'gradient', 'image'], rebuild: true, after: () => {
    if (bg.type === 'gradient' && !bg.colors) { bg.colors = ['#ff3d00', '#ff9100']; bg.angle = 160; }
    if (bg.type === 'color' && !bg.color) bg.color = '#111111';
  } }));
  if (bg.type === 'color') f.append(fld('Colour', bg, 'color', { type: 'color', def: '#111111' }));
  if (bg.type === 'gradient') {
    bg.colors = bg.colors || ['#000000', '#ffffff'];
    bg.colors.forEach((c, i) => f.append(h('div', { class: 'row' }, h('label', {}, `Stop ${i + 1}`), h('div', {},
      h('input', { type: 'color', value: /^#[0-9a-f]{6}$/i.test(c) ? c : '#ffffff', oninput: e => { bg.colors[i] = e.target.value; changed(); } }),
      bg.colors.length > 2 ? h('button', { class: 'sm', onclick: () => { bg.colors.splice(i, 1); changed(true); } }, '✕') : null))));
    if (bg.colors.length < 5) f.append(h('div', { class: 'row' }, h('label', {}), h('div', {}, h('button', { class: 'sm', onclick: () => { bg.colors.push('#ffffff'); changed(true); } }, '+ stop'))));
    f.append(fld('Angle', bg, 'angle', { type: 'range', min: 0, max: 360, step: 5, def: 160 }));
  }
  if (bg.type === 'image') {
    f.append(fld('Image', bg, 'asset', { type: 'select', options: assetOpts('image') }));
    f.append(fld('Slow zoom', bg, 'kenburns', { type: 'range', min: 0, max: 0.4, step: 0.02, def: 0 }));
    f.append(fld('Darken', bg, 'dim', { type: 'range', min: 0, max: 0.9, step: 0.05, def: 0 }));
    f.append(fld('Focus X', bg, 'focus_x', { type: 'range', min: 0, max: 1, step: 0.05, def: 0.5 }));
    f.append(fld('Focus Y', bg, 'focus_y', { type: 'range', min: 0, max: 1, step: 0.05, def: 0.5 }));
  }
}
function renderLayers() {
  const l = $('#layerList'); l.replaceChildren(); const L = scene().layers;
  if (!L.length) l.append(h('div', { class: 'mute' }, 'No layers yet. Add text, an image or a shape.'));
  L.forEach((ly, i) => {
    const mv = d => e => { e.stopPropagation(); const j = i + d; if (j < 0 || j >= L.length) return; [L[i], L[j]] = [L[j], L[i]]; selLayer = j; changed(true); };
    l.append(h('div', { class: 'item' + (i === selLayer ? ' sel' : ''), onclick: () => { selLayer = i; renderLayers(); renderLayerForm(); } },
      h('span', { class: 'mute' }, { text: 'T', image: '▣', shape: '◆' }[ly.type]),
      h('span', { class: 'n' }, ly.type === 'text' ? ly.text || '(empty)' : ly.type === 'image' ? ly.asset || '(no image)' : ly.shape || 'rect'),
      h('button', { class: 'sm', title: 'forward', onclick: mv(1) }, '↑'), h('button', { class: 'sm', title: 'back', onclick: mv(-1) }, '↓'),
      h('button', { class: 'sm', title: 'duplicate', onclick: e => { e.stopPropagation(); L.splice(i + 1, 0, JSON.parse(JSON.stringify(ly))); selLayer = i + 1; changed(true); } }, '⧉'),
      h('button', { class: 'sm danger', title: 'remove', onclick: e => { e.stopPropagation(); L.splice(i, 1); selLayer = null; changed(true); } }, '✕')));
  });
}
function renderLayerForm() {
  const card = $('#layerCard'), f = $('#layerForm'); f.replaceChildren(); const ly = layer();
  card.style.display = ly ? '' : 'none'; if (!ly) return;
  const nl = { rebuild: false };
  if (ly.type === 'text') {
    f.append(fld('Text', ly, 'text', { type: 'textarea', def: '' }));
    f.append(fld('Font', ly, 'font', { type: 'select', options: info.fonts, def: 'sans-bold' }));
    f.append(fld('Size', ly, 'size', { type: 'range', min: 0.02, max: 0.3, step: 0.005, def: 0.07 }));
    f.append(fld('Colour', ly, 'color', { type: 'color', def: '#ffffff' }));
    f.append(fld('Highlight *word*', ly, 'accent', { type: 'color', def: '#ffffff' }));
    f.append(fld('Align', ly, 'align', { type: 'select', options: ['center', 'left', 'right'], def: 'center' }));
    f.append(fld('Max width', ly, 'w', { type: 'range', min: 0.1, max: 1, step: 0.02, def: 0.84 }));
    f.append(fld('UPPERCASE', ly, 'upper', { type: 'checkbox' }));
    f.append(fld('Shadow', ly, 'shadow', { type: 'checkbox' }));
    const hasBox = !!ly.box;
    f.append(h('div', { class: 'row' }, h('label', {}, 'Box behind'), h('div', {}, h('input', { type: 'checkbox', checked: hasBox, onchange: e => { if (e.target.checked) ly.box = { color: '#000000', opacity: 0.6, pad: 0.03, radius: 0.5 }; else delete ly.box; changed(true); } }))));
    if (hasBox) { f.append(fld('Box colour', ly.box, 'color', { type: 'color', def: '#000000' })); f.append(fld('Box opacity', ly.box, 'opacity', { type: 'range', min: 0, max: 1, step: 0.05, def: 0.6 })); f.append(fld('Box padding', ly.box, 'pad', { type: 'range', min: 0, max: 0.1, step: 0.005, def: 0.03 })); }
    ly.stroke = ly.stroke || {};
    f.append(fld('Outline', ly.stroke, 'width', { type: 'range', min: 0, max: 0.015, step: 0.001, def: 0 }));
    if (ly.stroke.width) f.append(fld('Outline col.', ly.stroke, 'color', { type: 'color', def: '#000000' })); else if (!Object.keys(ly.stroke).length) delete ly.stroke;
  } else if (ly.type === 'image') {
    f.append(fld('Image', ly, 'asset', { type: 'select', options: assetOpts('image'), rebuild: true }));
    f.append(fld('Width', ly, 'w', { type: 'range', min: 0.05, max: 1.5, step: 0.01, def: 0.5 }));
    f.append(fld('Round corners', ly, 'radius', { type: 'range', min: 0, max: 0.5, step: 0.01, def: 0 }));
    f.append(fld('Shadow', ly, 'shadow', { type: 'checkbox' }));
  } else {
    f.append(fld('Shape', ly, 'shape', { type: 'select', options: ['rect', 'rounded', 'circle'], def: 'rect' }));
    f.append(fld('Colour', ly, 'color', { type: 'color', def: '#ffffff' }));
    f.append(fld('Width', ly, 'w', { type: 'range', min: 0.01, max: 1.5, step: 0.01, def: 0.5 }));
    if (ly.shape !== 'circle') f.append(fld('Height', ly, 'h', { type: 'range', min: 0.002, max: 1.5, step: 0.002, def: 0.1 }));
    if (ly.shape === 'rounded') f.append(fld('Roundness', ly, 'radius', { type: 'range', min: 0, max: 1, step: 0.05, def: 0.3 }));
    f.append(fld('Shadow', ly, 'shadow', { type: 'checkbox' }));
  }
  f.append(h('hr', { style: 'border:0;border-top:1px solid var(--line)' }));
  f.append(fld('Position X', ly, 'x', { type: 'range', min: -0.2, max: 1.2, step: 0.005, def: 0.5 }));
  f.append(fld('Position Y', ly, 'y', { type: 'range', min: -0.2, max: 1.2, step: 0.005, def: 0.5 }));
  f.append(fld('Opacity', ly, 'opacity', { type: 'range', min: 0, max: 1, step: 0.05, def: 1 }));
  f.append(fld('Rotate°', ly, 'rotate', { type: 'range', min: -180, max: 180, step: 1, def: 0 }));
  f.append(fld('Appear at (s)', ly, 'start', { type: 'number', min: 0, step: 0.1, def: 0 }));
  f.append(fld('Hide at (s)', ly, 'end', { type: 'number', min: 0, step: 0.1 }));
  f.append(fld('Animate in', ly, 'in', { type: 'select', options: info.anims_in, def: 'none' }));
  f.append(fld('Animate out', ly, 'out', { type: 'select', options: info.anims_out, def: 'none' }));
  f.append(fld('Anim secs', ly, 'anim_dur', { type: 'number', min: 0.05, max: 5, step: 0.05, def: 0.5 }));
}
function renderAssets() {
  const l = $('#assetList'); l.replaceChildren();
  if (!assets.length) { l.textContent = 'Logos, photos, music. Stored in assets/ on your machine.'; return; }
  assets.forEach(a => l.append(h('div', { class: 'item' },
    /\.(mp3|wav|m4a|aac|ogg)$/i.test(a) ? h('span', { class: 'thumb', style: 'display:grid;place-items:center' }, '♪') : h('img', { class: 'thumb', src: '/assets/' + encodeURIComponent(a) }),
    h('span', { class: 'n' }, a),
    h('button', { class: 'sm danger', onclick: async () => { if (!confirm(`Delete ${a} from assets/?`)) return; await api('/api/assets/' + encodeURIComponent(a), { method: 'DELETE' }); await loadAssets(); changed(true); } }, '✕'))));
}
function renderSizes() {
  const s = $('#sizes'); const keep = new Set([...s.querySelectorAll('input:checked')].map(i => i.value)); s.replaceChildren();
  if (!keep.size) keep.add('reels');
  info.presets.forEach(p => s.append(h('label', { class: 'chk' }, h('input', { type: 'checkbox', value: p.id, checked: keep.has(p.id) }), h('span', {}, p.label), h('small', {}, `${p.w}×${p.h}`))));
}
function renderAll() { renderProject(); renderScenes(); renderSceneForm(); renderLayers(); renderLayerForm(); renderAssets(); }

// ------------------------------------------------------------------ actions
document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
  const t = b.dataset.add, L = scene().layers;
  const base = { text: { type: 'text', text: 'Your headline', x: 0.5, y: 0.5, size: 0.08, color: '#ffffff', font: 'sans-bold', shadow: true, in: 'fade' },
    image: { type: 'image', asset: assets.find(a => /\.(png|jpe?g|webp|gif|bmp)$/i.test(a)) || '', x: 0.5, y: 0.3, w: 0.4, in: 'zoom' },
    shape: { type: 'shape', shape: 'rounded', x: 0.5, y: 0.8, w: 0.5, h: 0.08, color: '#ffffff', radius: 1, in: 'slide-up' } }[t];
  L.push(base); selLayer = L.length - 1; changed(true);
});
$('#addScene').onclick = () => { spec.scenes.push({ duration: 3, background: { type: 'color', color: '#111111' }, layers: [] }); selScene = spec.scenes.length - 1; selLayer = null; changed(true); };
$('#upl').onchange = async e => {
  for (const f of e.target.files) {
    try { await api('/api/assets/' + encodeURIComponent(f.name), { method: 'PUT', body: f }); say('Uploaded ' + f.name); } catch (err) { say(f.name + ': ' + err.message, true); }
  }
  e.target.value = ''; await loadAssets(); renderAll(); preview();
};
$('#saveBtn').onclick = async () => {
  const name = (spec.name || 'untitled').replace(/[^A-Za-z0-9_-]+/g, '-').replace(/^-|-$/g, '') || 'untitled';
  try { await api('/api/projects/' + name, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(spec) }); say(`Saved projects/${name}.json`); loadLists(); } catch (e) { say(e.message, true); }
};
$('#dlBtn').onclick = () => { const a = h('a', { href: URL.createObjectURL(new Blob([JSON.stringify(spec, null, 2)], { type: 'application/json' })), download: (spec.name || 'project') + '.json' }); a.click(); };
$('#jsonBtn').onclick = () => { const c = $('#jsonCard'); c.style.display = c.style.display === 'none' ? '' : 'none'; $('#jsonBox').value = JSON.stringify(spec, null, 2); };
$('#jsonApply').onclick = () => { try { const s = JSON.parse($('#jsonBox').value); if (!s.scenes || !s.scenes.length) throw new Error('needs scenes'); spec = s; selScene = 0; selLayer = null; $('#jsonErr').textContent = ''; changed(true); } catch (e) { $('#jsonErr').textContent = e.message; } };
function loadSpec(s) { spec = s; selScene = 0; selLayer = null; T = 0; changed(true); }
$('#tplSel').onchange = async e => { if (e.target.value) { loadSpec(await api('/api/templates/' + e.target.value)); e.target.value = ''; } };
$('#projSel').onchange = async e => { if (e.target.value) { loadSpec(await api('/api/projects/' + e.target.value)); e.target.value = ''; } };

// ------------------------------------------------------------------ export
$('#fmt').onchange = () => { $('#sceneRow').style.display = ['png', 'jpg'].includes($('#fmt').value) ? '' : 'none'; };
$('#renderBtn').onclick = async () => {
  const targets = [...$('#sizes').querySelectorAll('input:checked')].map(i => i.value);
  const cw = parseInt($('#cw').value), ch = parseInt($('#ch').value);
  if (cw && ch) targets.push({ w: cw, h: ch });
  const fmt = $('#fmt').value, sc = $('#expScene').value;
  try {
    const job = await post('/api/render', { spec, targets, format: fmt, scene: sc === '' ? null : parseInt(sc) });
    trackJob(job.id, fmt);
  } catch (e) { say(e.message, true); }
};
function trackJob(id, fmt) {
  const bar = h('i'), msg = h('span', {}), box = h('div', { class: 'out' }, h('div', {}, msg, ' ', h('button', { class: 'sm', onclick: () => post(`/api/jobs/${id}/cancel`, {}) }, 'cancel')), h('div', { class: 'bar' }, bar));
  $('#jobs').prepend(box);
  const tick = async () => {
    let j; try { j = await api('/api/jobs/' + id); } catch (e) { msg.textContent = e.message; return; }
    bar.style.width = (j.progress * 100) + '%'; msg.textContent = `${j.status} ${Math.round(j.progress * 100)}%`;
    if (j.status === 'done') {
      box.replaceChildren(...j.outputs.map(o => h('div', {},
        h('a', { href: o.url + '?download=1' }, '⬇ ' + o.file),
        /\.mp4$/.test(o.file) ? h('video', { src: o.url, controls: true, preload: 'metadata' }) : h('img', { src: o.url, loading: 'lazy' }))));
    } else if (j.status === 'error') { box.replaceChildren(h('span', { style: 'color:var(--bad)' }, j.error)); }
    else if (j.status === 'cancelled') { box.replaceChildren('Cancelled'); }
    else setTimeout(tick, 400);
  };
  tick();
}

// ------------------------------------------------------------------ boot
async function loadAssets() { assets = (await api('/api/assets')).assets; }
async function loadLists() {
  const [p, t] = await Promise.all([api('/api/projects'), api('/api/templates')]);
  const fill = (sel, items, label) => sel.replaceChildren(h('option', { value: '' }, label), items.map(x => h('option', { value: x }, x)));
  fill($('#projSel'), p.projects, 'Open project…'); fill($('#tplSel'), t.templates, 'Templates…');
}
(async () => {
  Object.assign(info, await api('/api/info'));
  if (!info.env.ffmpeg || !info.env.libx264) $('#ffwarn').style.display = 'block';
  await Promise.all([loadAssets(), loadLists()]);
  renderSizes(); $('#fmt').onchange();
  let s = null; try { s = JSON.parse(localStorage.getItem('ms_spec')); } catch (e) {}
  spec = s && s.scenes ? s : await api('/api/templates/sale-flash');
  changed(true);
})().catch(e => say(e.message, true));
</script>
</body>
</html>
